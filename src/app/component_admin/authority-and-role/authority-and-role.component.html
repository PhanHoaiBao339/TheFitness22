      <!-- Loading -->
      <div *ngIf="loading" class="d-flex flex-column align-items-center justify-content-center bg-light"
        style="height: 830px;">
        <div class="loader">
          <div class="orbe" style="--index: 0"></div>
          <div class="orbe" style="--index: 1"></div>
          <div class="orbe" style="--index: 2"></div>
          <div class="orbe" style="--index: 3"></div>
          <div class="orbe" style="--index: 4"></div>
        </div>
      </div>
      <!-- Loading -->
      <div *ngIf="!loading" class="outer-wrapper my-2 mx-2">

          <table class="table">
            <thead class="">
              <tr class="text-center">
                <th scope="col">#</th>
                <!-- <th scope="col">Id</th> -->
                <th scope="col">Username</th>
                <th scope="col">Fullname</th>
                <th scope="col" *ngFor="let role of listAllRole">{{role.id}}</th>
              </tr>
            </thead>
            <tbody>
              <tr class="align-middle text-center" *ngFor="let item of listAllAccount;index as i">
                <td class="text-center" scope="row">{{i+1}}</td>
                <!-- <td class="text-center">{{item?.id}}</td> -->
                <td>{{item?.username}}</td>
                <td>{{item?.fullname}}</td>
                <td class="p-0" *ngFor="let role of listAllRole">
                  <div class="form-check d-flex align-items-center justify-content-center">
                    <input class="form-check-input" type="checkbox" id="user" [checked]="authority_of(item,role)"
                      (click)="authority_changed(item,role)">
                  </div>
                </td>

              </tr>
            </tbody>
          </table>
        </div>
